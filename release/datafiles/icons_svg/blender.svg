<svg id="dasktoon_icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Soft Cartoon Glow Gradients -->
    <linearGradient id="toon_red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3D5A"/>
      <stop offset="100%" stop-color="#D61836"/>
    </linearGradient>
    <linearGradient id="toon_black" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#282A36"/>
      <stop offset="100%" stop-color="#12131A"/>
    </linearGradient>
    
    <!-- Mask for Soft Cartoon Cutout around T -->
    <mask id="t_gap_mask">
      <!-- White reveals everything -->
      <rect x="0" y="0" width="512" height="512" fill="#FFFFFF"/>
      <!-- Black cuts out clean gap around angled T -->
      <g transform="rotate(-14 256 256)">
        <rect x="90" y="196" width="332" height="68" rx="34" fill="#000000"/>
        <rect x="220" y="210" width="68" height="200" rx="34" fill="#000000"/>
      </g>
    </mask>
  </defs>

  <!-- 1. Smooth Animated Letter 'D' Body (Soft Rounded Cartoon Curves) -->
  <g mask="url(#t_gap_mask)">
    <path d="M 120 125 
             C 120 95, 145 75, 180 75 
             C 275 75, 415 125, 415 256 
             C 415 387, 275 437, 180 437 
             C 145 437, 120 417, 120 387 
             Z" 
          fill="url(#toon_red)"/>

    <!-- Inner Soft Counter Cutout -->
    <path d="M 185 155 
             C 240 155, 335 185, 335 256 
             C 335 327, 240 357, 185 357 
             C 175 357, 168 350, 168 340 
             L 168 172 
             C 168 162, 175 155, 185 155 
             Z" 
          fill="#13141B"/>
          
    <!-- Soft Playful Cel Highlight Arc on Top of D (Matching Red Tone) -->
    <path d="M 175 105 
             C 255 105, 360 145, 375 230 
             C 355 160, 260 125, 185 125 
             Z" 
          fill="#FF758C" 
          opacity="0.85"/>
  </g>

  <!-- 2. Dynamic Angled Letter 'T' with Soft Rounded Cartoon Caps (Pure Red & Black, No White Line) -->
  <g transform="rotate(-14 256 256)">
    <!-- T Crossbar (Soft Rounded Pill) -->
    <rect x="104" y="210" width="304" height="42" rx="21" fill="url(#toon_black)" stroke="#FF3D5A" stroke-width="4"/>
    
    <!-- T Stem (Soft Rounded Pill) -->
    <rect x="234" y="220" width="44" height="175" rx="22" fill="url(#toon_black)" stroke="#FF3D5A" stroke-width="4"/>
  </g>
</svg>