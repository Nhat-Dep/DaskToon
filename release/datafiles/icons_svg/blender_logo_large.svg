<svg id="dasktoon_logo_large" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <!-- Vibrant Red Gradient -->
    <linearGradient id="toon_red_lg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3D5A"/>
      <stop offset="100%" stop-color="#D61836"/>
    </linearGradient>
    <!-- Sleek Dark Gradient -->
    <linearGradient id="toon_black_lg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#282A36"/>
      <stop offset="100%" stop-color="#12131A"/>
    </linearGradient>
    <!-- Negative Space Mask for DT Monogram -->
    <mask id="t_gap_mask_lg">
      <rect x="0" y="0" width="512" height="512" fill="#FFFFFF"/>
      <g transform="rotate(-14 256 256)">
        <rect x="90" y="196" width="332" height="68" rx="34" fill="#000000"/>
        <rect x="220" y="210" width="68" height="200" rx="34" fill="#000000"/>
      </g>
    </mask>
  </defs>

  <!-- Group 1: Soft Animated DT Monogram Mark on Left -->
  <g transform="translate(30, 10) scale(0.74)">
    <g mask="url(#t_gap_mask_lg)">
      <path d="M 120 125 C 120 95, 145 75, 180 75 C 275 75, 415 125, 415 256 C 415 387, 275 437, 180 437 C 145 437, 120 417, 120 387 Z" fill="url(#toon_red_lg)"/>
      <path d="M 185 155 C 240 155, 335 185, 335 256 C 335 327, 240 357, 185 357 C 175 357, 168 350, 168 340 L 168 172 C 168 162, 175 155, 185 155 Z" fill="#13141B"/>
      <path d="M 175 105 C 255 105, 360 145, 375 230 C 355 160, 260 125, 185 125 Z" fill="#FF758C" opacity="0.85"/>
    </g>

    <g transform="rotate(-14 256 256)">
      <rect x="104" y="210" width="304" height="42" rx="21" fill="url(#toon_black_lg)" stroke="#FF3D5A" stroke-width="4"/>
      <rect x="234" y="220" width="44" height="175" rx="22" fill="url(#toon_black_lg)" stroke="#FF3D5A" stroke-width="4"/>
    </g>
  </g>

  <!-- Group 2: Stylized Custom Vector Path Typography "DaskToon" -->
  <g transform="translate(420, 130)">
    
    <!-- Letter 'D' (Custom Stylized Bold Geometric Path - White) -->
    <path d="M 0 0 L 45 0 C 85 0 110 22 110 52 C 110 82 85 104 45 104 L 0 104 Z M 26 22 L 26 82 L 44 82 C 68 82 82 70 82 52 C 82 34 68 22 44 22 Z" fill="#FFFFFF"/>
    
    <!-- Letter 'a' (White) -->
    <g transform="translate(125, 28)">
      <path d="M 28 0 C 48 0 60 12 60 32 L 60 76 L 38 76 L 38 64 C 32 72 22 78 10 78 C -6 78 -18 68 -18 52 C -18 36 -4 28 18 26 L 38 24 L 38 20 C 38 10 32 6 22 6 C 12 6 6 10 4 16 L -16 12 C -12 -4 4 -16 28 -16 Z M 38 42 L 20 44 C 8 46 2 50 2 58 C 2 64 8 68 16 68 C 28 68 38 60 38 48 Z" fill="#FFFFFF"/>
    </g>

    <!-- Letter 's' (White) -->
    <g transform="translate(205, 28)">
      <path d="M 24 -16 C 48 -16 62 -2 60 18 L 38 18 C 38 8 32 4 22 4 C 14 4 8 8 8 14 C 8 20 14 24 28 28 C 50 34 62 44 62 60 C 62 76 46 92 20 92 C -8 92 -22 76 -22 56 L 0 56 C 0 68 8 72 20 72 C 30 72 38 68 38 60 C 38 52 30 48 16 44 C -6 38 -16 28 -16 12 C -16 -4 0 -16 24 -16 Z" fill="#FFFFFF"/>
    </g>

    <!-- Letter 'k' (White) -->
    <g transform="translate(275, 0)">
      <path d="M 0 0 L 24 0 L 24 54 L 54 28 L 84 28 L 48 60 L 86 104 L 56 104 L 24 66 L 24 104 L 0 104 Z" fill="#FFFFFF"/>
    </g>

    <!-- Letter 'T' (Custom Stylized Bold Display - Crimson Red) -->
    <g transform="translate(375, 0)">
      <path d="M 0 0 L 78 0 L 78 24 L 51 24 L 51 104 L 27 104 L 27 24 L 0 24 Z" fill="url(#toon_red_lg)"/>
    </g>

    <!-- Letter 'o' (Crimson Red) -->
    <g transform="translate(465, 28)">
      <path d="M 32 -16 C 58 -16 76 6 76 38 C 76 70 58 92 32 92 C 6 92 -12 70 -12 38 C -12 6 6 -16 32 -16 Z M 32 6 C 18 6 10 20 10 38 C 10 56 18 70 32 70 C 46 70 54 56 54 38 C 54 20 46 6 32 6 Z" fill="url(#toon_red_lg)"/>
    </g>

    <!-- Letter 'o' (Crimson Red) -->
    <g transform="translate(560, 28)">
      <path d="M 32 -16 C 58 -16 76 6 76 38 C 76 70 58 92 32 92 C 6 92 -12 70 -12 38 C -12 6 6 -16 32 -16 Z M 32 6 C 18 6 10 20 10 38 C 10 56 18 70 32 70 C 46 70 54 56 54 38 C 54 20 46 6 32 6 Z" fill="url(#toon_red_lg)"/>
    </g>

    <!-- Letter 'n' (Crimson Red) -->
    <g transform="translate(655, 28)">
      <path d="M 0 0 L 22 0 L 22 14 C 28 4 40 -2 54 -2 C 74 -2 86 10 86 32 L 86 76 L 64 76 L 64 36 C 64 24 56 18 44 18 C 32 18 22 26 22 40 L 22 76 L 0 76 Z" fill="url(#toon_red_lg)"/>
    </g>
  </g>

  <!-- Group 3: Subtitle / Slogan "MORE EASY MORE FAST" in Modern Outlined Display -->
  <g transform="translate(425, 285)">
    <text x="0" y="0" 
          font-family="'Montserrat', 'Trebuchet MS', 'Segoe UI', 'Arial Black', sans-serif" 
          font-size="27" 
          font-weight="800" 
          font-style="italic"
          letter-spacing="9" 
          fill="#D0D6E5">
      MORE EASY MORE FAST
    </text>

    <!-- Sleek Rounded Red Neon Accent Bar with Motion Slice -->
    <g transform="translate(0, 18)">
      <rect x="0" y="0" width="370" height="5" rx="2.5" fill="url(#toon_red_lg)"/>
      <rect x="382" y="0" width="30" height="5" rx="2.5" fill="url(#toon_red_lg)"/>
      <circle cx="425" cy="2.5" r="2.5" fill="url(#toon_red_lg)"/>
    </g>
  </g>
</svg>